/*
 * shared:discovery-abstraction — service discovery 추상화 wrapper.
 *
 * Eureka (현재 운영) 와 AWS Cloud Map (Phase 10 cutover 시점 예정) 사이의
 * vendor 전환 비용을 격리하기 위한 추상화 layer 다.
 *
 * Java library only — Spring Boot 플러그인 미적용 (소비자가 fat jar 로 묶지 않도록).
 * `spring-cloud-starter-netflix-eureka-client` 는 compileOnly 로 두어 소비자가
 * 자체 build.gradle 에서 명시적으로 implementation 의존성을 추가해야 한다.
 *
 * 본 모듈 자체는 Phase 10 cutover 까지 어떤 service 도 의존하지 않는다.
 * Phase 8 2차 = wrapper 작성 + 단위 테스트만, 실 통합은 Phase 10 위임.
 */

plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework.boot:spring-boot-autoconfigure'

    // Eureka client — compileOnly 로 두어 소비자가 명시 의존성 추가 시점에만 활성.
    compileOnly 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}
