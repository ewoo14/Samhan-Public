name: CI

# Arologis has a separate workflow. This workflow covers Samhan Public services
# and shared modules. Manual workflow_dispatch remains available for full runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'services/arologis-service/**'
      - 'clients/arologis-desktop/**'
      - 'clients/arologis-mobile/**'
      - '.github/workflows/arologis-ci.yml'
      - '.github/workflows/arologis-deploy.yml'
      - 'infrastructure/grafana/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'services/arologis-service/**'
      - 'clients/arologis-desktop/**'
      - 'clients/arologis-mobile/**'
      - '.github/workflows/arologis-ci.yml'
      - '.github/workflows/arologis-deploy.yml'
      - 'infrastructure/grafana/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.group.timeout }}
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: shared+auth+gateway
            timeout: 30
            test-tasks: ':shared:common:test :shared:security:test :shared:collab-core:test :shared:realtime-abstraction:test :shared:user-client-abstraction:test :shared:discovery-abstraction:test :services:eureka-server:test :services:api-gateway:test :services:auth-service:test'
          - name: user+product+inventory+logging
            timeout: 30
            test-tasks: ':services:user-service:test :services:product-service:test :services:inventory-service:test :services:logging-service:test'
          - name: slip-units
            timeout: 30
            # Gradle --tests package filters do not include subpackages automatically.
            # #809 price memory unit packages are listed explicitly to avoid false-green.
            test-tasks: ':services:slip-service:test --tests "com.samhanair.logis.slip.attachment.*" --tests "com.samhanair.logis.slip.audit.service.*" --tests "com.samhanair.logis.slip.client.*" --tests "com.samhanair.logis.slip.comment.service.*" --tests "com.samhanair.logis.slip.domain.*" --tests "com.samhanair.logis.slip.delivery.domain.*" --tests "com.samhanair.logis.slip.delivery.service.*" --tests "com.samhanair.logis.slip.editrequest.service.*" --tests "com.samhanair.logis.slip.estimate.domain.*" --tests "com.samhanair.logis.slip.estimate.revision.*" --tests "com.samhanair.logis.slip.estimate.service.*" --tests "com.samhanair.logis.slip.estimate.web.*" --tests "com.samhanair.logis.slip.price.domain.*" --tests "com.samhanair.logis.slip.price.service.*" --tests "com.samhanair.logis.slip.realtime.*" --tests "com.samhanair.logis.slip.revision.*" --tests "com.samhanair.logis.slip.revision.service.*" --tests "com.samhanair.logis.slip.seed.*" --tests "com.samhanair.logis.slip.service.*" --tests "com.samhanair.logis.slip.service.dispatch.*" --tests "com.samhanair.logis.slip.vendor.*" --tests "com.samhanair.logis.slip.web.*" --tests "com.samhanair.logis.slip.collab.*" --tests "com.samhanair.logis.slip.mobile.dto.*" --tests "com.samhanair.logis.slip.mobile.service.*"'
          - name: slip-it-public
            timeout: 30
            test-tasks: ':services:slip-service:test --tests "com.samhanair.logis.slip.delivery.it.*" --tests "com.samhanair.logis.slip.publish.*"'
          - name: slip-it-core
            timeout: 30
            # slip.it.* does not automatically include nested packages; keep all IT slices explicit.
            test-tasks: ':services:slip-service:test --tests "com.samhanair.logis.slip.comment.it.*" --tests "com.samhanair.logis.slip.estimate.it.*" --tests "com.samhanair.logis.slip.estimate.it.collab.*" --tests "com.samhanair.logis.slip.estimate.snapshot.it.*" --tests "com.samhanair.logis.slip.it.*" --tests "com.samhanair.logis.slip.it.collab.*" --tests "com.samhanair.logis.slip.it.cutoff.*" --tests "com.samhanair.logis.slip.it.dispatch.*" --tests "com.samhanair.logis.slip.it.schedule.*" --tests "com.samhanair.logis.slip.repository.dispatch.*" --tests "com.samhanair.logis.slip.dispatch.*"'
          - name: accounting+partner
            timeout: 30
            test-tasks: ':services:accounting-service:test :services:partner-service:test :services:partner-auth-service:test :services:partner-order-service:test :services:dc-config-service:test'
          - name: accounting-codef-it
            timeout: 30
            test-tasks: ':services:accounting-service:test --tests "com.samhanair.logis.accounting.it.CodefImportControllerIT" --tests "com.samhanair.logis.accounting.it.CodefAccountSelectionIT" --tests "com.samhanair.logis.accounting.it.CodefConnectionRepositoryIT" --tests "com.samhanair.logis.accounting.it.CodefConnectionServiceIT" --tests "com.samhanair.logis.accounting.it.CodefConnectionControllerIT"'
          - name: accounting-cash-receipt-it
            timeout: 30
            test-tasks: ':services:accounting-service:test --tests "com.samhanair.logis.accounting.it.CashReceiptControllerIT" --tests "com.samhanair.logis.accounting.it.BankDepositReceiptIT" --tests "com.samhanair.logis.accounting.editrequest.lock.AccountingLockPoliciesTest" --tests "com.samhanair.logis.accounting.service.Mig9CashJournalServiceTest" --tests "com.samhanair.logis.accounting.it.Mig9CashJournalLinkIT" :services:auth-service:test --tests "com.samhanair.logis.auth.it.AuthFlywayV80SeedIT"'
          - name: phase9-10 (groupware+notification+dashboard)
            timeout: 30
            test-tasks: ':services:groupware-service:test :services:notification-service:test :services:dashboard-service:test'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.head_ref != 'main' }}

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Verify Docker availability
        run: |
          docker version
          docker ps

      - name: Assemble all modules
        run: ./gradlew assemble

      - name: Test (${{ matrix.group.name }})
        run: ./gradlew ${{ matrix.group.test-tasks }}

      - name: E2 CollectionRealtimePublisherTest skipped=0 hard gate
        if: matrix.group.name == 'shared+auth+gateway'
        run: |
          report='shared/realtime-abstraction/build/test-results/test/TEST-com.samhanair.logis.shared.realtime.collection.CollectionRealtimePublisherTest.xml'
          if [ ! -f "$report" ]; then
            echo "::error::CollectionRealtimePublisherTest JUnit report not found; E2 realtime-abstraction tests may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::CollectionRealtimePublisherTest skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: S3-2 EstimateCollabIT skipped=0 hard gate
        if: matrix.group.name == 'slip-it-core'
        run: |
          report='services/slip-service/build/test-results/test/TEST-com.samhanair.logis.slip.estimate.it.collab.EstimateCollabIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::EstimateCollabIT JUnit report not found; S3-2 coedit IT may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::EstimateCollabIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: S3-5 DispatchCollabIT skipped=0 hard gate
        if: matrix.group.name == 'slip-it-core'
        run: |
          report='services/slip-service/build/test-results/test/TEST-com.samhanair.logis.slip.it.dispatch.DispatchCollabIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::DispatchCollabIT JUnit report not found; S3-5 coedit IT may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::DispatchCollabIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: S3-3 JournalCollabIT skipped=0 hard gate
        if: matrix.group.name == 'accounting+partner'
        run: |
          report='services/accounting-service/build/test-results/test/TEST-com.samhanair.logis.accounting.it.collab.JournalCollabIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::JournalCollabIT JUnit report not found; S3-3 coedit IT may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::JournalCollabIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: S4d CashReceiptCoeditIT skipped=0 hard gate
        if: matrix.group.name == 'accounting+partner'
        run: |
          report='services/accounting-service/build/test-results/test/TEST-com.samhanair.logis.accounting.it.collab.CashReceiptCoeditIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::CashReceiptCoeditIT JUnit report not found; S4d coedit IT may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::CashReceiptCoeditIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: S3-4 ApprovalCollabIT skipped=0 hard gate
        if: matrix.group.name == 'phase9-10 (groupware+notification+dashboard)'
        run: |
          report='services/groupware-service/build/test-results/test/TEST-com.samhanair.logis.groupware.it.ApprovalCollabIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::ApprovalCollabIT JUnit report not found; S3-4 coedit IT may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::ApprovalCollabIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: BC3 CODEF IT skipped=0 hard gate
        if: matrix.group.name == 'accounting-codef-it'
        run: |
          report='services/accounting-service/build/test-results/test/TEST-com.samhanair.logis.accounting.it.CodefAccountSelectionIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::CodefAccountSelectionIT JUnit report not found; BC3 IT may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::CodefAccountSelectionIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: E3 S1 CashReceiptControllerIT skipped=0 hard gate
        if: matrix.group.name == 'accounting-cash-receipt-it'
        run: |
          report='services/accounting-service/build/test-results/test/TEST-com.samhanair.logis.accounting.it.CashReceiptControllerIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::CashReceiptControllerIT JUnit report not found; E3 S1 cash receipt IT may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::CashReceiptControllerIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: E3 S3 BankDepositReceiptIT skipped=0 hard gate
        if: matrix.group.name == 'accounting-cash-receipt-it'
        run: |
          report='services/accounting-service/build/test-results/test/TEST-com.samhanair.logis.accounting.it.BankDepositReceiptIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::BankDepositReceiptIT JUnit report not found; E3 S3 bank-linked cash receipt IT may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::BankDepositReceiptIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: MIG-9 Mig9CashJournalLinkIT skipped=0 hard gate
        if: matrix.group.name == 'accounting-cash-receipt-it'
        run: |
          report='services/accounting-service/build/test-results/test/TEST-com.samhanair.logis.accounting.it.Mig9CashJournalLinkIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::Mig9CashJournalLinkIT JUnit report not found; MIG-9 link schema regression IT may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::Mig9CashJournalLinkIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: test-reports-${{ matrix.group.name }}
          path: |
            services/*/build/reports/tests/test/
            shared/*/build/reports/tests/test/
          retention-days: 14

      - name: Publish JUnit report
        if: always() && github.event_name == 'pull_request'
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          require_tests: ${{ matrix.group.name == 'accounting-codef-it' || matrix.group.name == 'accounting-cash-receipt-it' }}
          check_name: JUnit test result (${{ matrix.group.name }})

  notion-zero-guard:
    name: Notion Runtime Zero Guard (SP-08-7)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Notion runtime dependencies
        run: |
          chmod +x scripts/check-notion-zero.sh
          bash scripts/check-notion-zero.sh

  credential-plaintext-guard:
    name: Credential Plaintext Guard (SP-08-8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check plaintext credential leakage
        run: |
          chmod +x scripts/check-credential-plaintext.sh
          bash scripts/check-credential-plaintext.sh

  config-audit-guard:
    name: "Config Audit Guard (downstream URL/port consistency, #745)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate downstream URL/port consistency
        shell: pwsh
        run: ./infrastructure/scripts/validate-config-audit.ps1 -Detailed

  frontend-ds:
    name: Frontend DS (typecheck + lint + build + storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/web/design-system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/web/design-system/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck build config
        run: npx tsc -p tsconfig.build.json --noEmit

      - name: Typecheck dev config
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Vite build
        run: npm run build

      - name: Storybook build
        run: npm run build-storybook

      - name: Upload Storybook artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: storybook-static-${{ github.run_number }}
          path: clients/web/design-system/storybook-static
          retention-days: 7

  frontend-desktop:
    name: Frontend Desktop (typecheck + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-ds]
    defaults:
      run:
        working-directory: clients/desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            clients/web/design-system/package-lock.json
            clients/desktop/package-lock.json

      - name: Prebuild design-system file dependency
        working-directory: clients/web/design-system
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        run: npm ci

      - name: Typecheck desktop
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Electron app
        run: npm run build

      - name: Build renderer web
        run: npm run build:web

      - name: Build Capacitor webview
        run: npm run build:capacitor
        env:
          VITE_API_BASE_URL: ''

      - name: Unit tests
        run: npm test

  frontend-order-app:
    name: Frontend Order-App (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/web/order-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/web/order-app/package-lock.json

      - name: Install order-app dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Vite build
        run: npm run build

  frontend-mobile-public:
    name: Frontend Mobile-Public (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-ds]
    defaults:
      run:
        working-directory: clients/web/mobile-public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            clients/web/design-system/package-lock.json
            clients/web/mobile-public/package-lock.json

      - name: Prebuild design-system file dependency
        working-directory: clients/web/design-system
        run: |
          npm ci
          npm run build

      - name: Install mobile-public dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Vite build
        run: npm run build

  frontend-mobile-staff:
    name: Frontend Mobile-Staff (typecheck + expo doctor + prebuild dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/mobile-staff

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/mobile-staff/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate app.config.js variants
        run: |
          node -e "
            const cfg = require('./app.config.js');
            const expo = cfg.expo;
            if (!expo.name || !expo.version) { console.error('app.config.js: missing name/version'); process.exit(1); }
            if (!expo.extra || !expo.extra.buildEnv) { console.error('app.config.js: missing extra.buildEnv'); process.exit(1); }
            if (!expo.ios || !expo.ios.bundleIdentifier) { console.error('app.config.js: missing ios.bundleIdentifier'); process.exit(1); }
            if (!expo.android || !expo.android.package) { console.error('app.config.js: missing android.package'); process.exit(1); }
            console.log('app.config.js validated:', expo.name, 'v' + expo.version, '/', expo.extra.buildEnv);
          "

      - name: Expo doctor
        run: npx expo-doctor
        continue-on-error: true

      - name: Expo prebuild dry-run
        run: npx expo prebuild --no-install --clean
        continue-on-error: true

      - name: Validate eas.json syntax
        run: |
          if [ -f eas.json ]; then
            node -e "
              const eas = require('./eas.json');
              const profiles = Object.keys(eas.build || {});
              if (profiles.length === 0) { console.error('eas.json: missing build profiles'); process.exit(1); }
              console.log('eas.json validated. Profiles:', profiles.join(', '));
            "
          else
            echo 'eas.json not found; skipping.'
          fi
