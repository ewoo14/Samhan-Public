name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write          # mikepenz/action-junit-report: check run 생성
  pull-requests: write   # JUnit 결과 PR 코멘트 게시

jobs:
  build-and-test:
    name: 빌드 + 테스트 (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.group.timeout }}  # group 별 timeout (slip 60분, 그 외 30분)
    strategy:
      fail-fast: false  # 1 group fail 시 다른 group 도 결과 확인
      matrix:
        group:
          - name: shared+auth+gateway
            timeout: 30
            test-tasks: ':shared:common:test :shared:security:test :shared:user-client-abstraction:test :shared:discovery-abstraction:test :services:eureka-server:test :services:api-gateway:test :services:auth-service:test'
          - name: user+product+inventory+logging
            timeout: 30
            test-tasks: ':services:user-service:test :services:product-service:test :services:inventory-service:test :services:logging-service:test'
          - name: slip-units
            # slip-service 단위 + 빠른 client mock 만 (큰 IT 제외)
            timeout: 30
            test-tasks: ':services:slip-service:test --tests "com.samhanair.logis.slip.client.*" --tests "com.samhanair.logis.slip.domain.*" --tests "com.samhanair.logis.slip.delivery.domain.*" --tests "com.samhanair.logis.slip.delivery.service.*" --tests "com.samhanair.logis.slip.service.*"'
          - name: slip-it-public
            # slip-service public + delivery IT (5 파일) — Testcontainers per-class spin-up 부담으로 60분 상향 (3차 fix)
            timeout: 60
            test-tasks: ':services:slip-service:test --tests "com.samhanair.logis.slip.delivery.it.*" --tests "com.samhanair.logis.slip.publish.*"'
          - name: slip-it-core
            # slip-service core IT (it/ 9 파일 — SlipController/Lifecycle/Inspect/Internal/Lookup/SignatureAdmin/NumberService/Domain) — 60분 상향 (3차 fix)
            timeout: 60
            test-tasks: ':services:slip-service:test --tests "com.samhanair.logis.slip.it.*"'
          - name: accounting+partner
            timeout: 30
            test-tasks: ':services:accounting-service:test :services:partner-service:test :services:partner-auth-service:test :services:partner-order-service:test :services:dc-config-service:test'
          - name: phase9-10 (groupware+notification+dashboard+arologis)
            timeout: 30
            test-tasks: ':services:groupware-service:test :services:notification-service:test :services:dashboard-service:test :services:arologis-service:test'

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 캐시 + Wrapper 검증
        uses: gradle/actions/setup-gradle@v4   # 5차 fix: v3 cache-restore HTTP 400 회피
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.head_ref != 'main' }}

      - name: gradlew 실행 권한 보장 (Windows 커밋 방어)
        run: chmod +x ./gradlew

      - name: Docker 가용성 확인 (Testcontainers 용)
        run: |
          docker version
          docker ps

      # 5차 fix: --no-daemon 제거 — assemble→test 사이 JVM 워밍업 재활용 (52s 절약).
      - name: assemble (전 모듈)
        run: ./gradlew assemble

      - name: test (${{ matrix.group.name }})
        run: ./gradlew ${{ matrix.group.test-tasks }}

      - name: 테스트 리포트 아티팩트 업로드 (실패 포함)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.group.name }}
          path: |
            services/*/build/reports/tests/test/
            shared/*/build/reports/tests/test/
          retention-days: 14

      - name: JUnit 결과 PR 코멘트로 게시
        if: always() && github.event_name == 'pull_request'
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          require_tests: false
          check_name: JUnit 테스트 결과 (${{ matrix.group.name }})

  frontend-ds:
    name: Frontend DS (typecheck + lint + build + storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/web/design-system

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/web/design-system/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: typecheck (build config)
        run: npx tsc -p tsconfig.build.json --noEmit

      - name: typecheck (dev config — stories/tests 포함)
        run: npx tsc -p tsconfig.json --noEmit

      - name: lint
        run: npm run lint
        continue-on-error: true   # legacy 코드 사전 존재 오류 허용 — feature 브랜치별 신규 코드 검증은 PR 검토에서

      - name: vite build
        run: npm run build

      - name: storybook 정적 빌드
        run: npm run build-storybook

      - name: storybook 정적 산출 업로드 (PR 미리보기)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static-${{ github.run_number }}
          path: clients/web/design-system/storybook-static
          retention-days: 7

  frontend-desktop:
    name: Frontend Desktop (typecheck + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-ds]   # design-system 빌드 후 desktop (file: dependency)
    defaults:
      run:
        working-directory: clients/desktop

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            clients/web/design-system/package-lock.json
            clients/desktop/package-lock.json

      - name: "design-system 사전 빌드 (file: dependency)"
        working-directory: clients/web/design-system
        run: |
          npm ci
          npm run build

      - name: desktop 의존성 설치
        run: npm ci

      - name: typecheck (Electron node + web)
        run: npm run typecheck

      - name: lint
        run: npm run lint
        continue-on-error: true   # legacy 코드 사전 존재 오류 허용

      - name: build (electron-vite)
        run: npm run build

  frontend-mobile-staff:
    name: Frontend Mobile-Staff (typecheck + expo doctor + prebuild dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/mobile-staff

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/mobile-staff/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: typecheck (tsc --noEmit)
        run: npm run typecheck

      # W10-3 종합 TM 채택 fix (O-DEVOPS-1) — Expo plugin 정합 사전 가드.
      # 본 PR (W10-3) 시점 4 weight Pretendard OTF 실배치 + app.json plugins 등록 검증.
      # continue-on-error = true — graceful guard (asset 부분 누락 회귀 시 워크플로우 fail 회피).
      - name: Expo doctor (plugin 정합 점검)
        run: npx expo-doctor
        continue-on-error: true

      # Expo prebuild dry-run — native 코드 생성 가능성 사전 가드 (EAS Build 진입 전 회귀 방지).
      # --no-install --clean = node_modules 미변형 + native 디렉토리 임시 생성.
      - name: Expo prebuild dry-run
        run: npx expo prebuild --no-install --clean
        continue-on-error: true
