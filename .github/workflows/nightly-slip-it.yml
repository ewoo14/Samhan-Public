# =============================================================================
# Nightly slip-service Integration Test (slip-it-public + slip-it-core)
# =============================================================================
#
# 목적:
#   PR CI 의 slip-it-* matrix 가 ubuntu-latest (2-core/7GB) 환경에서 60분
#   timeout 회귀 (PR #99 옵션 B → matrix 제거) 한 사실을 보강하기 위해,
#   nightly 시점에 별도 workflow 로 slip-service IT 회귀 검증을 수행한다.
#
# 회귀 차단 흐름:
#   - PR CI (ci.yml) — slip-it-public + slip-it-core matrix 재활성 (timeout 30분).
#     PR #102 V11 fix (CONCURRENTLY 제거 → idle in transaction deadlock 차단)
#     이후 30분 안에 통과 예상.
#   - nightly (본 workflow) — 매일 02:00 KST (= 17:00 UTC) main + 활성 feature
#     branch 에 대해 60분 timeout 으로 보강 검증. fail 시 GitHub Issue 자동 생성.
#
# W10-5 회고 반영:
#   - PR #99 5/6/7차 fix 회고 — slip IT 가 60분 timeout 도 빠듯한 정황.
#     본 nightly 분리로 PR fast-feedback (30분) + 야간 deep regression (60분)
#     2-track 회귀 차단 패턴 도입.
#   - feedback_pr_ci_monitoring 메모리 가드 — fail 시 자동 Issue 생성.
# =============================================================================

name: Nightly slip-service IT

on:
  schedule:
    # 매일 17:00 UTC = 02:00 KST (다음날). 사용자 활동이 거의 없는 시간대.
    - cron: '0 17 * * *'
  workflow_dispatch:
    # 수동 trigger — 회귀 의심 시 즉시 실행 가능.

permissions:
  contents: read
  checks: write          # mikepenz/action-junit-report: check run 생성
  issues: write          # fail 시 GitHub Issue 자동 생성

jobs:
  # 활성 branch 자동 탐색 — main + feature/integrated-* + feature/legacy-* + feat/coedit-* 등
  # 모든 활성 long-lived branch 에 대해 nightly matrix 실행.
  discover-branches:
    name: 활성 branch 탐색
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branches: ${{ steps.list.outputs.branches }}
    steps:
      - name: 저장소 체크아웃 (전체 branch fetch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 활성 branch 목록 산출 (main + feature/integrated-* + feature/legacy-* + feat/coedit-*)
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # main 은 항상 포함. feature/integrated-* / feature/legacy-* 패턴의
          # remote branch 와 협업 coedit active branch 만 추가 (단편 fix branch 는 PR CI 로 충분, nightly 미대상).
          BRANCHES=$(git branch -r | \
            grep -E 'origin/(main|feature/integrated-.*|feature/legacy-.*|feat/coedit-.*)$' | \
            sed 's|origin/||' | tr -d ' ' | sort -u | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"
          echo "탐색된 branch: $BRANCHES"

  slip-it-nightly:
    name: slip-it nightly (${{ matrix.branch }} / ${{ matrix.group.name }})
    needs: [discover-branches]
    runs-on: ubuntu-latest
    timeout-minutes: 60   # PR CI (30분) 대비 deep timeout — IT context 가 무거운 정황 대비
    strategy:
      fail-fast: false   # 1 group fail 시 다른 group / branch 도 결과 확인
      matrix:
        branch: ${{ fromJson(needs.discover-branches.outputs.branches) }}
        group:
          # PR #99 옵션 B 시점 matrix 2분할(slip-it-public/slip-it-core) 구조는 유지하되,
          # 각 그룹 필터는 PR CI(ci.yml) 동명 잡 미러링을 방침으로 한다 (#809 R4, 연관 Issue #821).
          - name: slip-it-public
            # #809 R4 (연관 Issue #821): 구 필터 web.public_.*/web.openapi.* 는 PR #99 계획서에서 복사된 뒤
            # 레포에 존재한 적 없는 유령 패키지(git 전 이력 0건)로, "No tests found for given includes"
            # nightly 3연속 실패(07-12/07-13/07-14) 원인 — PR CI slip-it-public 필터(delivery.it/publish)로 정렬.
            # Gradle * 는 점(.) 경계를 구분하지 않아 하위 패키지도 매치한다. 토큰은 ci.yml 과 동일한 coverage inventory 로 유지한다.
            test-tasks: ':services:slip-service:test --tests "com.samhanair.logis.slip.delivery.it.*" --tests "com.samhanair.logis.slip.publish.*"'
          - name: slip-it-core
            # PR CI slip-it-core IT 필터를 nightly deep-regression 에 미러링 등재.
            # #809 R4 (연관 Issue #821): web.core.*/web.internal.* 도 레포에 존재한 적 없는 유령 패키지(git 전 이력
            # 0건)로 판명되어 제거 — 나머지 필터가 실 테스트를 매치해 잡 실패 원인은 아니었던 dead token 이며,
            # 제거 후 필터는 ci.yml 동명 잡과 완전 동일.
            # Gradle * 는 점(.) 경계를 구분하지 않아 하위 패키지도 매치한다. 명시 토큰은 ci.yml 과의 inventory 대조용이다.
            test-tasks: ':services:slip-service:test --tests "com.samhanair.logis.slip.comment.it.*" --tests "com.samhanair.logis.slip.estimate.it.*" --tests "com.samhanair.logis.slip.estimate.it.collab.*" --tests "com.samhanair.logis.slip.estimate.snapshot.it.*" --tests "com.samhanair.logis.slip.it.*" --tests "com.samhanair.logis.slip.it.collab.*" --tests "com.samhanair.logis.slip.it.cutoff.*" --tests "com.samhanair.logis.slip.it.dispatch.*" --tests "com.samhanair.logis.slip.it.schedule.*" --tests "com.samhanair.logis.slip.repository.dispatch.*" --tests "com.samhanair.logis.slip.dispatch.*"'

    steps:
      - name: 저장소 체크아웃 (${{ matrix.branch }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: JDK 17 설치 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 캐시 + Wrapper 검증
        uses: gradle/actions/setup-gradle@v4
        with:
          # nightly 는 main 외 feature branch 도 기록 — write 허용 (read-only false).
          cache-read-only: false

      - name: gradlew 실행 권한 보장 (Windows 커밋 방어)
        run: chmod +x ./gradlew

      - name: Docker 가용성 확인 (Testcontainers 용)
        run: |
          docker version
          docker ps

      - name: assemble (전 모듈)
        run: ./gradlew assemble

      - name: test (slip-service ${{ matrix.group.name }})
        run: ./gradlew ${{ matrix.group.test-tasks }}

      - name: S3-5 DispatchCollabIT skipped=0 hard gate
        if: matrix.group.name == 'slip-it-core'
        run: |
          report='services/slip-service/build/test-results/test/TEST-com.samhanair.logis.slip.it.dispatch.DispatchCollabIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::DispatchCollabIT JUnit report not found; S3-5 coedit IT may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::DispatchCollabIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: 테스트 리포트 아티팩트 업로드 (실패 포함)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true  # 스토리지 쿼터 등 업로드 실패가 잡을 red 로 만들지 않도록(테스트 결과만 게이트)
        with:
          name: nightly-slip-it-${{ matrix.branch }}-${{ matrix.group.name }}-${{ github.run_number }}
          path: |
            services/slip-service/build/reports/tests/test/
            services/slip-service/build/test-results/test/
          retention-days: 14

      - name: JUnit check run 등록
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'services/slip-service/build/test-results/test/TEST-*.xml'
          require_tests: false
          check_name: 'nightly slip-it (${{ matrix.branch }} / ${{ matrix.group.name }})'

  # nightly 실패 집계 — 1개 이상 matrix fail 시 GitHub Issue 1건 자동 생성.
  # feedback_pr_ci_monitoring 가드: fail 시 즉시 issue 발행으로 PM 알림.
  open-issue-on-failure:
    name: nightly 실패 시 Issue 자동 생성
    needs: [slip-it-nightly]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: nightly fail Issue 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE_KST=$(TZ=Asia/Seoul date +%Y-%m-%d)
          cat > issue-body.md <<'ISSUE_BODY'
          ## 개요

          nightly slip-service IT workflow 가 실패했습니다. 본 Issue 는 자동 생성되었으며, fix 후 close 의무.

          ## 실행 정보

          - workflow: `.github/workflows/nightly-slip-it.yml`
          - run URL: __RUN_URL__
          - 실행 시간 (KST): __DATE_KST__ 02:00
          - 대상 matrix: slip-it-public + slip-it-core × (main + 활성 feature branch)

          ## 점검 체크리스트

          - [ ] 실패 matrix 의 어떤 branch / group 인지 run URL 에서 확인
          - [ ] 60분 timeout 도달 (resource 부족) 인지, assertion fail (회귀) 인지 분류
          - [ ] 회귀이면 즉시 fix PR (영향 branch 우선)
          - [ ] timeout 이면 PR #99/#102 회고 참조하여 추가 split 또는 self-hosted runner 검토
          - [ ] PR fix 머지 후 nightly workflow 재실행 (`workflow_dispatch`) 로 회복 확인
          - [ ] 본 Issue close

          ## 참고

          - PR #99 (5/6/7차 fix 회고): slip-it 60분 timeout 회귀 사 (옵션 B = matrix 제거)
          - PR #102: V11 CONCURRENTLY 제거 — idle in transaction deadlock 차단 fix
          - W10-5 회고: nightly 분리 + PR matrix 재활성 (timeout 30분) 패턴 도입
          ISSUE_BODY

          sed -i "s|__RUN_URL__|${RUN_URL}|g; s|__DATE_KST__|${DATE_KST}|g" issue-body.md
          ISSUE_URL=$(gh issue create \
            --title "[nightly] slip-service IT 실패 — ${DATE_KST}" \
            --body-file issue-body.md)

          # Issue 생성 자체가 label drift 때문에 실패하지 않도록 먼저 무라벨로 생성한다.
          # 아래 label 은 2026-07-16 gh label list 실재 목록 기준이며, 부착 실패는 warning 만 남긴다.
          if ! gh issue edit "${ISSUE_URL}" --add-label "bug,team:slip,priority:high"; then
            echo "::warning::nightly Issue 는 생성됐지만 label 부착에 실패했습니다: ${ISSUE_URL}"
          fi
