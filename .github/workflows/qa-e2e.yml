name: QA E2E (Playwright + Detox)

on:
  pull_request:
    paths:
      - 'qa/**'
      - 'clients/**'
      - '.github/workflows/qa-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  playwright:
    name: Playwright (web + electron + mobile emul)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: qa/playwright/package-lock.json

      - name: Playwright 의존성 설치
        working-directory: qa/playwright
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Playwright 브라우저 설치 (system deps 포함)
        working-directory: qa/playwright
        run: npx playwright install --with-deps

      - name: typecheck (시나리오 + utils)
        working-directory: qa/playwright
        run: npx tsc --noEmit

      - name: Playwright dry-run (backend 미가동 시 it.skip 동작)
        working-directory: qa/playwright
        env:
          QA_API_BASE_URL: http://localhost:8080
        run: npx playwright test --reporter=list || true

      - name: HTML 리포트 업로드 (실패 + always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa/playwright/playwright-report/
          retention-days: 7

      - name: JUnit 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit
          path: qa/playwright/test-results/
          retention-days: 7

  detox-android:
    name: Detox Android (mobile v4, AVD)
    runs-on: macos-latest
    timeout-minutes: 60
    # iOS 는 별도 self-hosted macOS runner 또는 EAS Build 통합 후속
    # Android 는 macos-latest 의 hardware accel 가능 AVD 사용 가능

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detox 의존성 설치
        working-directory: qa/detox
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: typecheck (e2e 시나리오)
        working-directory: qa/detox
        run: npx tsc --noEmit

      # Android emulator 부팅 + detox build/test 는 후속 실 빌드 PR 에서 enable
      # 본 PR 은 셋업 + typecheck 까지만 검증
      - name: Detox config 검증
        working-directory: qa/detox
        run: npx detox config --configuration android.emu.release || true
