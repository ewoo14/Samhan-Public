# SamhanLogis - Nginx reverse-proxy stub (dev only, HTTP).
# TLS / samhan-air.com subdomain wiring is deployment-time concern (plan §4).
# Drop additional server { } blocks into ./conf.d/*.conf as services come up.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 2048;

  # Per-subdomain server blocks live here once samhan-air.com routing is wired.
  include /etc/nginx/conf.d/*.conf;

  # Stub default server: keeps the container healthy and rejects unknown hosts
  # with 404 until the real reverse-proxy configs land in conf.d/.
  server {
    listen       80 default_server;
    server_name  _;

    location /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 404;
    }
  }
}
