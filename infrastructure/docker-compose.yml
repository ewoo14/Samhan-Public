# SamhanLogis - Local development infrastructure stack
# Phase 1: data services + monitoring (Prometheus / Grafana / Nginx stub)
# All credentials below are DEV-ONLY. Do NOT use in staging or production.

networks:
  samhan-net:
    driver: bridge
    name: samhan-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  es_data:
  minio_data:
  prometheus_data:
  grafana_data:

services:
  # ---------------------------------------------------------------------------
  # Data services
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: samhan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: samhan
      POSTGRES_PASSWORD: samhan_dev_pw   # DEV-ONLY
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samhan"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - samhan-net

  redis:
    image: redis:7-alpine
    container_name: samhan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - samhan-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: samhan-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: samhan
      RABBITMQ_DEFAULT_PASS: samhan_dev_pw   # DEV-ONLY
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - samhan-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: samhan-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
    networks:
      - samhan-net

  minio:
    image: minio/minio:latest
    container_name: samhan-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: samhan
      MINIO_ROOT_PASSWORD: samhan_dev_pw   # DEV-ONLY
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - samhan-net

  # ---------------------------------------------------------------------------
  # Monitoring stack
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: samhan-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - samhan-net

  grafana:
    image: grafana/grafana:11.3.1
    container_name: samhan-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: samhan_dev_pw   # DEV-ONLY
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3100:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - samhan-net

  nginx:
    image: nginx:1.27-alpine
    container_name: samhan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - samhan-net
