/*
 * services:dashboard-service — Phase 9 W4
 *
 * KPI 일/주/월 스냅샷 + 실시간 재고 캐시 + 매출 집계 도메인. ServiceDiscoveryClient 네 번째 소비자
 * (W1 partner / W2 groupware / W3 notification → W4 dashboard).
 *
 * 외부 의존성 = 4 service:
 *   - inventory-service (8085) — 실시간 재고 lookup
 *   - accounting-service (8087) — 매출 데이터 집계
 *   - partner-order-service (8088) — 주문 건수 집계
 *   - partner-service (8095, W1) — 거래처 정보 lookup
 *
 * 주요 책임:
 *   - KpiSnapshot (KPI 일/주/월 스냅샷)
 *   - RealTimeStock (실시간 재고 캐시)
 *   - SalesAggregate (매출 집계)
 *   - 2 PostgreSQL materialized view (mv_realtime_stock_summary / mv_sales_daily_summary)
 *   - 5분 간격 scheduled REFRESH MATERIALIZED VIEW CONCURRENTLY (admin trigger 가능)
 *   - Internal endpoint (X-Internal-Token, KPI lookup 용)
 *   - Admin endpoint (KPI / 실시간 재고 / 매출 / refresh)
 *   - Caffeine cache (KPI 응답 60s TTL — DevOps W3 backlog #4 채택, Phase 10 시점 Redis 토글 약속)
 *
 * Owns the `dashboard_db` schema in PostgreSQL.
 * Flyway 는 day-one 부터 활성 — src/main/resources/db/migration 참조.
 */

plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Phase 9 W4 — Caffeine cache (KPI 응답 60s TTL, DevOps W3 backlog #4 채택)
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // springdoc-openapi — /v3/api-docs (JSON) + /swagger-ui.html (대화형 UI) 자동 노출
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    implementation project(':shared:common')
    // Phase 8 2차 — vendor 추상화 wrapper (provider=eureka default, Phase 10 시점 aws-cloud-map 토글)
    implementation project(':shared:discovery-abstraction')
    // Phase 9 W4 — UserVerifier 표준 abstraction (W3 backlog #1 채택)
    implementation project(':shared:user-client-abstraction')

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.testcontainers:postgresql:1.20.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    archiveFileName = 'dashboard-service.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
