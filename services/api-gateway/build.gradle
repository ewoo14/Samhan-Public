/*
 * services:api-gateway — Spring Cloud Gateway (reactive / WebFlux).
 *
 * Single edge router for SamhanLogis MSA. Routes are declared in
 * application.yml and registered with Eureka. JWT authentication is enforced
 * via a custom GatewayFilterFactory (see gateway/filter package).
 *
 * IMPORTANT: do NOT add spring-boot-starter-web — it would force the servlet
 * stack and break the reactive Netty server that Spring Cloud Gateway runs
 * on. Validation and actuator both have reactive-compatible variants used
 * here.
 */

plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation project(':shared:common')

    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    archiveFileName = 'api-gateway.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
