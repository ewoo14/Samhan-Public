server:
  port: 8088

spring:
  application:
    name: partner-order-service
  datasource:
    # 시크릿 placeholder — DB 자격증명은 반드시 환경변수로 주입.
    # default 값은 로컬 docker-compose 와의 호환을 위한 자리 표시자이며 실제 환경에서는 override 필수.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:partner_order_db}
    username: ${DB_USER:CHANGE_ME_LOCAL_ONLY}
    password: ${DB_PASSWORD:CHANGE_ME_LOCAL_ONLY}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# W10-4 (PR #99) DV-3 — shared:security InternalAuthProperties 통합 (app.security.internal.token).
# samhan.internal-token 은 legacy 보존 (PartnerOrder 외 client 가 system 호출용으로 직접 참조 가능).
# app.partner-order.* — Stage 3 local-test seed toggle (PartnerOrderSeeder).
#   운영/CI 에서는 반드시 false (또는 미설정) 유지. dev profile + 본 토글 양쪽 활성 시에만 30건 시드 진입.
app:
  security:
    internal:
      # SAMHAN_INTERNAL_TOKEN 우선, INTERNAL_TOKEN legacy fallback
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_TOKEN:dev-only-token-replace}}
  partner-order:
    seed-test-data: ${SAMHAN_PARTNER_ORDER_SEED_TEST_DATA:false}

# samhan.* — partner-order-service 전용 옵션 (PartnerOrderProperties / OutboxProperties)
samhan:
  # legacy 호환 (Phase 11 cutover 시점 제거 가능)
  internal-token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_TOKEN:dev-only-token-replace}}
  draft:
    ttl-days: 30
    cleanup-cron: "0 0 3 * * *"
  outbox:
    cron: "0 */5 * * * *"
    max-retry-hours: 24

# Resilience4J — slipServiceClient 가 가장 중요 (M5 §3 옵션 A)
resilience4j:
  circuitbreaker:
    instances:
      slipServiceClient:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      dcConfigClient:
        slidingWindowSize: 10
        failureRateThreshold: 70
        waitDurationInOpenState: 20s
      productClient:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      inventoryClient:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      partnerAuthClient:
        slidingWindowSize: 10
        failureRateThreshold: 70
        waitDurationInOpenState: 20s
  timelimiter:
    instances:
      slipServiceClient:
        timeoutDuration: 5s
      dcConfigClient:
        timeoutDuration: 3s
      productClient:
        timeoutDuration: 3s
      inventoryClient:
        timeoutDuration: 3s
      partnerAuthClient:
        timeoutDuration: 3s

# 외부 서비스 base URL (Eureka 비활성 환경 fallback. 일반적으로는 lb:// + service-id 사용).
# Phase 8 2차 — full URL 표준 (SAMHAN_<SERVICE>_SERVICE_URL 우선, <NAME>_HOST legacy fallback (host only) — Phase 10 cutover 시점 단일화).
external:
  product-service: ${SAMHAN_PRODUCT_SERVICE_URL:http://${PRODUCT_HOST:product-service}:8084}
  inventory-service: ${SAMHAN_INVENTORY_SERVICE_URL:http://${INVENTORY_HOST:inventory-service}:8085}
  slip-service: ${SAMHAN_SLIP_SERVICE_URL:http://${SLIP_HOST:slip-service}:8086}
  dc-config-service: ${SAMHAN_DC_CONFIG_SERVICE_URL:http://${DC_CONFIG_HOST:dc-config-service}:8089}
  partner-auth-service: ${SAMHAN_PARTNER_AUTH_SERVICE_URL:http://${PARTNER_AUTH_HOST:partner-auth-service}:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:partner_order_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
