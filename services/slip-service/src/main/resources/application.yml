server:
  port: 8086

spring:
  application:
    name: slip-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:slip_db}
    username: ${DB_USER:samhan}
    password: ${DB_PASSWORD:samhan_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  security:
    internal:
      token: ${INTERNAL_AUTH_TOKEN:dev-internal-token-change-me}
  # Slice B SMS 게이트웨이 — Aligo (한국 SMS 게이트웨이, Solapi 에서 마이그)
  sms:
    vendor: ${SMS_VENDOR:aligo}
    api-key: ${ALIGO_API_KEY:dev-key}
    user-id: ${ALIGO_USER_ID:dev-user}
    sender-phone: ${ALIGO_SENDER_PHONE:01000000000}
    base-url: ${ALIGO_BASE_URL:https://apis.aligo.in}
  # Slice B — 공개 모바일 페이지 base URL (SMS 본문 토큰 링크용)
  public:
    base-url: ${PUBLIC_BASE_URL:https://sign.samhan-air.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:slip_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
