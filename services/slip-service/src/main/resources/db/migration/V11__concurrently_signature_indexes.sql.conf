## V11 script-config — Flyway 9.x+ 표준 (https://documentation.red-gate.com/fd/script-configuration-files-273973272.html)
##
## CREATE INDEX CONCURRENTLY 는 Postgres transaction block 내부에서 실행 불가 (PG 제약).
## Flyway 는 기본적으로 마이그레이션을 transaction 안에서 실행하므로 본 옵션 false 로 강제 차단.
## 본 옵션이 누락되면 운영 cutover 시점 ERROR: CREATE INDEX CONCURRENTLY cannot run inside a transaction block 발생.
##
## D-P10-15 사용자 강화 가드 (2026-05-08) 채택 — DV-2 운영 lock 회피 흡수 부수.
executeInTransaction=false
