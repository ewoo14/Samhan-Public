server:
  port: 8082

spring:
  application:
    name: logging-service
  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:samhan}
    password: ${RABBIT_PASSWORD:samhan_dev_pw}
  # PR-H4b BE-E — shared:realtime-abstraction module 이 transitive 로 starter-data-jpa 를 가져오지만
  # logging-service 는 Postgres JPA 를 사용하지 않음 (audit sink = Elasticsearch). DataSource/JPA
  # autoconfig 를 명시 exclude 하여 startup 시 DB connection 시도 차단.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
# `local` profile is for offline code editing only.
# Elasticsearch + RabbitMQ + Eureka autoconfig are disabled so the app can
# boot without those services running. Integration tests still need the
# real services (or testcontainers).
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      # PR-H4b BE-E — shared:realtime-abstraction transitive JPA exclude (default 프로필과 일관)
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
