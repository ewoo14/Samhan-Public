server:
  port: 8084

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:product_db}
    username: ${DB_USER:samhan}
    password: ${DB_PASSWORD:samhan_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  security:
    internal:
      # Phase 8 2차 — SAMHAN_INTERNAL_TOKEN 우선, INTERNAL_AUTH_TOKEN legacy fallback (Phase 10 cutover 시점 단일화)
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:dev-internal-token-change-me}}
      # W10-4 (PR #99) DV-3 — product-service 자체 prefix /products/internal/ + ROLE_INTERNAL + missing 토큰 즉시 401
      path-prefix: /products/internal/
      role: INTERNAL
      allow-missing-token: false
  scheduling:
    # 옵션 C-2 (개발책임자 결정 2026-05-05): 시트 → DB cron 1시간 주기 sync
    enabled: ${PRODUCT_SYNC_SCHEDULING_ENABLED:true}
    product-sync-cron: ${PRODUCT_SYNC_CRON:0 0 * * * *}

# Google Sheets 연동 (옵션 C-2 sync source-of-truth)
# 시크릿: GOOGLE_SERVICE_ACCOUNT_KEY 환경변수 → JSON path. 본 코드 placeholder 만 보유 (.env 별도)
google:
  sheets:
    sheet-id: ${GOOGLE_SHEETS_SHEET_ID:1RJqO3jT-yJTi3NDBhL60o_cZWlVETGTU7UlvIKXuVNQ}
    service-account-key-path: ${GOOGLE_SERVICE_ACCOUNT_KEY:/etc/samhan/sa-key.json}
    cache-ttl-minutes: ${GOOGLE_SHEETS_CACHE_TTL_MIN:5}
    endpoint-override: ${GOOGLE_SHEETS_ENDPOINT_OVERRIDE:}

# Phase 6 M1a 시드 스크립트 — dry-run mode 우선 (G13)
# (legacy 보존: cron 가용 전 fallback. ProductSheetSyncService 가 1회 sync 후 시트 데이터로 덮어쓰기)
seed:
  dry-run: ${SEED_DRY_RUN_MODE:true}
  report-dir: ${SEED_REPORT_DIR:docs/dev-reports}
  sheet-dir: ${SEED_SHEET_DIR:../../migration/source/sheet}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:product_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# local profile 에서는 시트 sync 비활성 (Service Account JSON 부재 가능)
app:
  scheduling:
    enabled: false
