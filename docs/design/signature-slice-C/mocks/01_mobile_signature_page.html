<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>서명 페이지 — 삼한물류</title>
<style>
  :root {
    --m-bg:           #FAFBFC;
    --m-card:         #FFFFFF;
    --m-border:       #E1E5EA;
    --m-ink-1:        #1A1F2E;
    --m-ink-2:        #5C6773;
    --m-ink-3:        #8A95A4;
    --m-brand:        #1E40AF;
    --m-brand-bg:     #DBEAFE;
    --m-success:      #10B981;
    --m-danger:       #EF4444;
    --m-pad-page:     16px;
    --m-pad-card:     16px;
    --m-card-gap:     12px;
    --m-radius-card:  8px;
    --m-radius-btn:   4px;
    --m-font-base:    16px;
    --m-font-sm:      14px;
    --m-font-xs:      12px;
    --m-font-h-card:  18px;
    --m-lh-tight:     1.3;
    --m-lh-normal:    1.5;
    --m-elev-card:    0 1px 3px rgba(0, 0, 0, 0.06);
    --m-tap-min:      44px;
    --signature-canvas-border:        #C9D1D9;
    --signature-canvas-border-active: #1E40AF;
    --signature-canvas-bg:            #FFFFFF;
    --signature-pen-color:            #000000;
    --signature-placeholder-color:    #8A95A4;
    --signature-canvas-radius:        8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", Roboto, sans-serif;
    background: var(--m-bg);
    color: var(--m-ink-1);
    font-size: var(--m-font-base);
    line-height: var(--m-lh-normal);
  }
  .m-brand-bar {
    background: var(--m-brand);
    color: #FFFFFF;
    height: 40px;
    display: flex;
    align-items: center;
    padding: 0 var(--m-pad-page);
    font-size: var(--m-font-sm);
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .m-page {
    max-width: 480px;
    margin: 0 auto;
    padding: var(--m-pad-page);
  }
  .m-back-link {
    display: inline-block;
    color: var(--m-brand);
    font-size: var(--m-font-sm);
    text-decoration: none;
    padding: 8px 0;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .m-slip-card {
    background: var(--m-card);
    border: 1px solid var(--m-border);
    border-radius: var(--m-radius-card);
    padding: var(--m-pad-card);
    box-shadow: var(--m-elev-card);
    margin-bottom: 16px;
  }
  .m-slip-card-title {
    font-size: var(--m-font-h-card);
    font-weight: 600;
    margin: 0 0 12px 0;
  }
  .m-slip-info {
    margin: 0 0 4px 0;
    font-size: var(--m-font-base);
  }
  .m-slip-info-label {
    color: var(--m-ink-3);
    font-size: var(--m-font-sm);
    display: inline-block;
    width: 60px;
  }
  .m-slip-info-sm {
    font-size: var(--m-font-sm);
    color: var(--m-ink-2);
  }
  .m-divider {
    border: 0;
    border-top: 1px dashed var(--m-border);
    margin: 12px 0;
  }
  .m-line-row {
    display: flex;
    justify-content: space-between;
    font-size: var(--m-font-sm);
    margin-bottom: 4px;
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  .m-line-name { flex: 1; }
  .m-line-qty { width: 50px; text-align: right; color: var(--m-ink-2); }
  .m-line-amount { width: 90px; text-align: right; color: var(--m-ink-1); font-weight: 600; }
  .m-total {
    text-align: right;
    font-size: var(--m-font-base);
    font-weight: 600;
    margin-top: 8px;
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  .m-section-label {
    font-size: var(--m-font-sm);
    color: var(--m-ink-2);
    margin: 16px 0 8px 0;
    font-weight: 600;
  }
  .m-name-input {
    width: 100%;
    height: var(--m-tap-min);
    padding: 0 12px;
    border: 1px solid var(--m-border);
    border-radius: var(--m-radius-btn);
    font-size: var(--m-font-base);
    background: var(--m-card);
    color: var(--m-ink-1);
  }
  .m-name-input:focus {
    outline: 2px solid var(--m-brand);
    outline-offset: -1px;
    border-color: var(--m-brand);
  }
  .m-sig-canvas-wrap {
    position: relative;
    background: var(--signature-canvas-bg);
    border: 2px dashed var(--signature-canvas-border);
    border-radius: var(--signature-canvas-radius);
    padding: 4px;
    width: 100%;
    max-width: 400px;
    height: 200px;
    margin: 0 auto;
  }
  .m-sig-canvas-wrap.is-empty::before {
    content: "여기에 서명해주세요";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--signature-placeholder-color);
    font-size: var(--m-font-sm);
    pointer-events: none;
  }
  .m-sig-canvas-wrap:not(.is-empty) {
    border-style: solid;
    border-color: var(--signature-canvas-border-active);
  }
  .m-sig-canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: transparent;
    touch-action: none;
  }
  .m-sig-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }
  .m-btn {
    min-height: var(--m-tap-min);
    line-height: var(--m-tap-min);
    font-size: var(--m-font-sm);
    font-weight: 600;
    border-radius: var(--m-radius-btn);
    text-align: center;
    cursor: pointer;
    border: 1px solid;
  }
  .m-btn-outline {
    background: var(--m-card);
    color: var(--m-brand);
    border-color: var(--m-brand);
  }
  .m-btn-primary {
    background: var(--m-brand);
    color: #FFFFFF;
    border-color: var(--m-brand);
  }
  .m-btn:disabled {
    background: #F4F6F8;
    color: var(--m-ink-3);
    border-color: var(--m-border);
    cursor: not-allowed;
  }
  .m-footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--m-border);
    font-size: var(--m-font-xs);
    color: var(--m-ink-3);
    text-align: center;
  }
  .m-footer p { margin: 4px 0; }
  .m-footer a { color: var(--m-brand); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <header class="m-brand-bar">삼한물류</header>
  <div class="m-page">
    <a class="m-back-link" href="#">◀ 목록으로</a>

    <article class="m-slip-card">
      <h1 class="m-slip-card-title">전표 상세</h1>
      <p class="m-slip-info"><span class="m-slip-info-label">거래처:</span>한국전력</p>
      <p class="m-slip-info-sm"><span class="m-slip-info-label">전표번호:</span>2026/05/05-1</p>
      <p class="m-slip-info-sm"><span class="m-slip-info-label">배송지:</span>서울시 강남구 테헤란로 152, 강남파이낸스센터 22층</p>

      <hr class="m-divider" />

      <div class="m-line-row">
        <span class="m-line-name">모터 220V</span>
        <span class="m-line-qty">2 EA</span>
        <span class="m-line-amount">600,000</span>
      </div>
      <div class="m-line-row">
        <span class="m-line-name">펌프 4HP</span>
        <span class="m-line-qty">1 EA</span>
        <span class="m-line-amount">650,000</span>
      </div>

      <hr class="m-divider" />
      <p class="m-total">합계: 1,250,000 원</p>
    </article>

    <div class="m-section-label">인수자 정보</div>
    <input class="m-name-input" type="text" placeholder="인수자 성함" value="" />

    <div class="m-section-label">서명</div>
    <div class="m-sig-canvas-wrap is-empty">
      <canvas class="m-sig-canvas" width="400" height="200"></canvas>
    </div>

    <div class="m-sig-actions">
      <button class="m-btn m-btn-outline" disabled>다시 서명</button>
      <button class="m-btn m-btn-primary" disabled>서명 완료</button>
    </div>

    <footer class="m-footer">
      <p>토큰 만료: 2026/05/06 23:59</p>
      <p>문의: <a href="tel:0212345678">02-XXXX-XXXX</a></p>
    </footer>
  </div>
</body>
</html>
